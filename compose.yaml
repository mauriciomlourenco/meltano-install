services:
  postgres:
    image: postgres:12
    container_name: meltano-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meltano_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - meltano_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meltano -d meltano_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meltano_postgres_data: